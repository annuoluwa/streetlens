services:
  - type: web
    name: streetlens-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.googletagmanager.com https://*.render.com https://*.neon.tech https://res.cloudinary.com; img-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://res.cloudinary.com data: blob: *; style-src 'self' 'unsafe-inline'; font-src 'self' data:;"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
